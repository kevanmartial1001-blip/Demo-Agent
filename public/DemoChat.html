<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your AI Employee</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#0b0c10; --muted:#647085; --line:#e6e8f0; --accent:#0ea5e9;
    --bubble-user:#e8f3ff; --bubble-ai:#ffffff;
    --speak:#1e90ff; --listen:#10b981;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,Inter,Segoe UI,Arial}
  .app{display:flex;flex-direction:column;height:100%}

  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:10}
  header h1{font-size:15px;font-weight:600;margin:0}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .toggle button{border:none;background:#fff;padding:8px 12px;cursor:pointer;font-weight:600;color:#334155}
  .toggle button.active{background:var(--ink);color:#fff}
  .spacer{flex:1}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}

  main{flex:1;overflow:auto}
  .stream{max-width:820px;margin:0 auto;padding:16px}
  .msg{display:flex;margin:14px 0}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:720px;border:1px solid var(--line);background:var(--bubble-ai);padding:12px 14px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .msg.user .bubble{background:var(--bubble-user)}
  .role{font-size:12px;color:#647085;margin-bottom:6px}
  .cards{display:grid;gap:10px;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h3{margin:0 0 6px 0;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{border:1px solid var(--line);padding:8px;text-align:left}
  .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:#647085;background:#fff}

  footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
  .composer{max-width:820px;margin:0 auto}
  .row{display:flex;gap:10px;align-items:center}
  .box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  input,button,textarea{font:inherit}
  input[type="text"]{flex:1;border:none;outline:none;background:transparent;padding:8px 6px}
  button{border:none;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
  button.ghost{background:#eef2f7;color:#0b0c10}
  button:disabled{opacity:.6;cursor:not-allowed}
  .pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;color:#647085;font-weight:600}

  /* Voice-Note stream (separate from Text) */
  .audio-note{display:flex;align-items:center;gap:10px}
  .audio-note small{color:#647085}

  /* Call canvas */
  .callWrap{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;padding:8px 0}
  .viz{
    width:120px;height:120px;border-radius:999px;background:#eaf6ff;border:3px solid #bfe7ff;
    box-shadow:0 12px 40px rgba(14,165,233,.18);
    transform:scale(1);transition:transform .08s linear, border-color .15s ease, box-shadow .15s ease;
  }
  .status{margin-top:16px;color:#647085;font-weight:700}
  .prompt{font-size:13px;color:#9aa6b2;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Your AI Employee</h1>
    <div class="toggle" id="modeToggle">
      <button data-mode="text" class="active">Text</button>
      <button data-mode="voicenote">Voice Note</button>
      <button data-mode="call">Call</button>
    </div>
    <div class="spacer"></div>
    <button id="gearBtn" class="icon-btn" title="Company KB">⚙️</button>
  </header>

  <main>
    <!-- TEXT STREAM -->
    <div id="stream" class="stream"></div>

    <!-- VOICE NOTE STREAM (answers render here; separate from Text) -->
    <div id="vnStream" class="stream" style="display:none"></div>

    <!-- CALL CANVAS -->
    <div id="callArea" class="callWrap">
      <div id="viz" class="viz"></div>
      <div id="callStatus" class="status">Tell me, how can I help you today?</div>
      <div class="prompt">Hands-free: just speak. I’ll answer out loud, then listen again.</div>
      <!-- remote audio for OpenAI Realtime (Pro path) -->
      <audio id="remoteAudio" autoplay playsinline></audio>
    </div>
  </main>

  <!-- FOOTERS (switch per mode) -->
  <footer>
    <!-- TEXT COMPOSER -->
    <div id="textFooter" class="composer">
      <div class="row box">
        <input id="prompt" type="text" placeholder="Ask anything for your business…" />
        <button id="send">Send</button>
      </div>
    </div>

    <!-- VOICE NOTE CONTROLS (bottom) -->
    <div id="vnFooter" class="composer" style="display:none">
      <div class="row box" style="justify-content:center">
        <button id="vnRecord" class="ghost">● Record</button>
        <button id="vnStop" class="ghost" disabled>Stop</button>
        <button id="vnSend" disabled>Send</button>
        <span id="vnStatus" class="pill">Idle</span>
        <audio id="vnPlayer" controls style="display:none"></audio>
      </div>
    </div>

    <!-- CALL has no footer controls -->
  </footer>
</div>

<!-- KB Modal -->
<div id="kbModal" class="modal" style="display:none">
  <div class="sheet">
    <h2>Company KB</h2>
    <div class="field">
      <label style="font-size:13px;color:#647085">JSON</label>
      <textarea id="kbText" style="width:100%;height:220px;font-family:ui-monospace,Menlo,monospace">{
  "company_id": "acme-123",
  "company_name": "ACME Retail Group",
  "sector": "Retail",
  "primary_region": "Marbella",
  "example_top_product": "Ultra Hoodie",
  "example_top_region": "Andalucía",
  "example_employee_1": "C. Alvarez",
  "example_employee_2": "M. Duarte",
  "example_employee_3": "S. Ruiz"
}</textarea>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button id="kbCancel" class="button ghost">Cancel</button>
      <button id="kbSave">Save</button>
    </div>
  </div>
</div>

<script>
/* ================== Elements & state ================== */
let messages = [];              // Text-mode messages
let vnMessages = [];            // Voice-note messages (separate stream)

const $modeToggle = document.getElementById('modeToggle');
const $stream = document.getElementById('stream');
const $vnStream = document.getElementById('vnStream');

const $textFooter = document.getElementById('textFooter');
const $vnFooter = document.getElementById('vnFooter');

const $callArea = document.getElementById('callArea');
const $viz = document.getElementById('viz');
const $callStatus = document.getElementById('callStatus');
const $remoteAudio = document.getElementById('remoteAudio');

const $prompt = document.getElementById('prompt');
const $send = document.getElementById('send');

const $gearBtn = document.getElementById('gearBtn');
const $kbModal = document.getElementById('kbModal');
const $kbText = document.getElementById('kbText');
const $kbSave = document.getElementById('kbSave');
const $kbCancel = document.getElementById('kbCancel');

try { const saved = localStorage.getItem('demo_kb'); if (saved) $kbText.value = saved; } catch {}

/* ================== Shared helpers ================== */
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function tableHTML(t){ if(!t||!t.columns||!t.rows) return ''; let h='<table><thead><tr>'; for(const c of t.columns) h+=`<th>${esc(String(c))}</th>`; h+='</tr></thead><tbody>'; for(const r of t.rows) h+='<tr>'+r.map(v=>`<td>${esc(String(v))}</td>`).join('')+'</tr>'; h+='</tbody></table>'; return h; }
function assistantHTML(j){
  const nl = j.nl ? `<div>${esc(j.nl)}</div>` : '';
  const answer = j.answer?.format==='table'
    ? `<div class="card"><h3>Answer</h3><div style="color:#6b7280">${esc(j.answer.summary||'')}</div>${tableHTML(j.answer.value)}</div>`
    : `<div class="card"><h3>Answer</h3><div>${esc(j.answer?.value||'')}</div></div>`;
  const explain = `<div class="card"><h3>How it worked</h3><ol>${(j.explain?.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
  const impact = `<div class="card"><h3>Why it matters</h3><ul>${(j.impact?.bullets||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  const meta = `<div class="meta"><span class="chip">Intent: ${esc(j.meta?.intent||'')}</span><span class="chip">Template: ${esc(j.meta?.template_id||'')}</span><span class="chip">Trace: ${esc(j.meta?.trace_id||'')}</span></div>`;
  return `${nl}<div class="cards">${answer}${explain}${impact}</div>${meta}`;
}
function historyForAPI(){
  const h=[]; // Only text-mode history is sent (voice modes are demo-only)
  for(const m of messages){
    if(m.role==='user') h.push({role:'user',text:m.html.replace(/<[^>]+>/g,'')});
    if(m.role==='assistant'&&m.raw?.meta) h.push({role:'assistant',intent:m.raw.meta.intent,entities:m.raw.entities||{}});
  }
  return h.slice(-12);
}
async function askAPI(text){
  let kb={}; try{ kb=JSON.parse($kbText.value);}catch{}
  const r = await fetch('/api/demoAgent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({utterance:text,kb, demo:true, history:historyForAPI()})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ================== Text-mode rendering ================== */
function renderText(){
  $stream.innerHTML = messages.map(m=>{
    const role = m.role==='user'?'user':'assistant';
    return `<div class="msg ${role}"><div class="bubble">${role==='user'?'<div class="role">You</div>':'<div class="role">Your AI Employee</div>'}${m.html}</div></div>`;
  }).join('');
  $stream.scrollTop = $stream.scrollHeight;
}
function pushUser(text){ messages.push({role:'user', html:esc(text)}); renderText(); }
function pushAssistant(j){ messages.push({role:'assistant', html:assistantHTML(j), raw:{meta:j.meta}}); renderText(); }

/* ================== Voice-Note rendering (separate) ================== */
function renderVN(){
  $vnStream.innerHTML = vnMessages.map(m=>{
    const role = m.role==='user'?'user':'assistant';
    return `<div class="msg ${role}"><div class="bubble">${
      role==='user'
        ? '<div class="role">You (voice note)</div>' + m.html
        : '<div class="role">Your AI Employee</div>' + m.html
    }</div></div>`;
  }).join('');
  $vnStream.scrollTop = $vnStream.scrollHeight;
}
function vnPushAudio(blobUrl, durationSec){
  const html = `<div class="audio-note"><audio controls src="${blobUrl}"></audio><small>${Math.round(durationSec)}s</small></div>`;
  vnMessages.push({ role:'user', html }); renderVN();
}
function vnPushAssistant(j){ vnMessages.push({ role:'assistant', html:assistantHTML(j) }); renderVN(); }

/* ================== Text mode events ================== */
function sendText(){
  const t = $prompt.value.trim(); if(!t) return;
  pushUser(t); $prompt.value='';
  askAPI(t).then(pushAssistant).catch(e=>pushAssistant({ nl:`Error: ${esc(String(e.message||e))}`, answer:{format:'text',value:''}, explain:{steps:[]}, impact:{bullets:[]}, meta:{} }));
}
$send.addEventListener('click', sendText);
$prompt.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }});

/* ================== Voice Note mode (bottom controls) ================== */
const $vnRecord = document.getElementById('vnRecord');
const $vnStop = document.getElementById('vnStop');
const $vnSend = document.getElementById('vnSend');
const $vnStatus = document.getElementById('vnStatus');
const $vnPlayer = document.getElementById('vnPlayer');

let vnMediaRec=null, vnChunks=[], vnBlob=null, vnMime=null, vnDurationSec=0, vnStartAt=0;

$vnRecord?.addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    vnMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    vnMediaRec = new MediaRecorder(stream,{ mimeType: vnMime });
    vnChunks = []; vnStartAt = Date.now();
    vnMediaRec.ondataavailable = e=>{ if (e.data?.size) vnChunks.push(e.data); };
    vnMediaRec.onstart = ()=>{ $vnStatus.textContent='Recording…'; $vnRecord.disabled=true; $vnStop.disabled=false; $vnSend.disabled=true; $vnPlayer.style.display='none'; };
    vnMediaRec.onstop = ()=>{
      vnDurationSec = (Date.now()-vnStartAt)/1000;
      vnBlob = new Blob(vnChunks,{type: vnMime});
      const url = URL.createObjectURL(vnBlob);
      $vnPlayer.src = url; $vnPlayer.style.display='inline-block';
      $vnStatus.textContent='Ready to send'; $vnSend.disabled=false; $vnRecord.disabled=false; $vnStop.disabled=true;
    };
    vnMediaRec.start();
  }catch(e){ $vnStatus.textContent='Mic permission needed'; }
});
$vnStop?.addEventListener('click', ()=>{ try{ vnMediaRec?.stop(); }catch{} });

$vnSend?.addEventListener('click', async ()=>{
  if(!vnBlob) return;
  const url = $vnPlayer.src;
  // 1) Show the audio note in VN thread (no transcript)
  vnPushAudio(url, vnDurationSec);

  // 2) Transcribe silently to drive the AI (provider = Deepgram or Whisper)
  $vnSend.disabled=true; $vnStatus.textContent='Transcribing…';
  const base64 = await blobToBase64(vnBlob);
  const res = await fetch('/api/transcribe', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ audio: base64, mime: vnMime })
  });
  const j = await res.json();
  if (!j.ok){ $vnStatus.textContent='Transcription failed'; $vnSend.disabled=false; return; }
  const text = j.text || '';
  // 3) Get the AI answer and render it in VN stream (text cards)
  askAPI(text).then(r => { vnPushAssistant(r); $vnStatus.textContent='Idle'; $vnSend.disabled=false; })
              .catch(() => { vnPushAssistant({ nl:'Sorry, there was an error.', answer:{format:'text',value:''}, explain:{steps:[]}, impact:{bullets:[]}, meta:{} }); $vnStatus.textContent='Idle'; $vnSend.disabled=false; });
});
function blobToBase64(blob){ return new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); }); }

/* ================== Call mode (Pro: OpenAI Realtime WebRTC; Fallback: browser SR/TTS) ================== */
let useRealtime = false;   // flipped on if server says realtime is configured
let pc=null, micStream=null; // realtime
let audioCtx=null, analyser=null, rafId=null;
let sr=null, speaking=false, listening=false; // fallback SR/TTS

// --- Realtime (WebRTC) ---
async function startRealtimeCall(){
  // ask backend whether realtime is configured + get ephemeral session
  const resp = await fetch('/api/realtimeSession');
  if (!resp.ok) throw new Error('No realtime session available');
  const { websocket_url, client_secret } = await resp.json(); // `client_secret.value` is the ephemeral token (server returns short form below)
  useRealtime = true;

  // capture mic
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true } });

  pc = new RTCPeerConnection();
  // local mic to PC
  micStream.getTracks().forEach(t => pc.addTrack(t, micStream));

  // remote audio
  pc.ontrack = (e)=>{ $remoteAudio.srcObject = e.streams[0]; };

  // data channel is optional (not used here)
  pc.createDataChannel("oai-events");

  const offer = await pc.createOffer({ offerToReceiveAudio: true });
  await pc.setLocalDescription(offer);

  // send offer to OpenAI Realtime
  const sdpResp = await fetch(websocket_url || "https://api.openai.com/v1/realtime?model=gpt-4o-realtime-preview", {
    method: "POST",
    headers: { Authorization: `Bearer ${client_secret}`, "Content-Type": "application/sdp" },
    body: offer.sdp
  });
  const answer = { type:"answer", sdp: await sdpResp.text() };
  await pc.setRemoteDescription(answer);

  // green visual to indicate active
  $viz.style.borderColor = 'var(--listen)';
  $viz.style.boxShadow = '0 12px 40px rgba(16,185,129,.22)';
  $callStatus.textContent = "You're connected — just talk.";
}

// --- Fallback SR/TTS (kept from earlier, trimmed) ---
function sttAvailable(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function startVizFallback(){
  if (audioCtx) return;
  const init = async ()=>{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
    const src = audioCtx.createMediaStreamSource(stream); src.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    function tick(now){
      analyser.getByteTimeDomainData(data);
      let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
      const rms=Math.sqrt(sum/data.length);
      if(listening){ $viz.style.borderColor='var(--listen)'; $viz.style.boxShadow='0 12px 40px rgba(16,185,129,.22)'; const scale=1+Math.min(1.0,rms*3.4); $viz.style.transform=`scale(${scale.toFixed(2)})`; }
      else if(speaking){ const t=now/520; const scale=1+0.07*Math.sin(t*2*Math.PI); $viz.style.transform=`scale(${scale.toFixed(2)})`; $viz.style.borderColor='var(--speak)'; $viz.style.boxShadow='0 12px 40px rgba(30,144,255,.25)'; }
      rafId=requestAnimationFrame(tick);
    }
    rafId=requestAnimationFrame(tick);
  };
  init();
}
let selectedVoice=null;
function getVoicesOnce(){ return new Promise(r=>{ const v=speechSynthesis.getVoices(); if(v&&v.length) return r(v); speechSynthesis.onvoiceschanged=()=>r(speechSynthesis.getVoices()); }); }
async function pickEnglishVoice(){ const voices=await getVoicesOnce(); const prefer=[/en-US.*(Female|Samantha|Google US|Jenny|America|Alloy|Natural)/i,/en-GB/i,/en-/i]; for(const rx of prefer){ const hit=voices.find(v=>rx.test(`${v.name} ${v.lang}`)); if(hit) return hit; } return voices[0]||null; }
async function speakFallback(t){ if(!window.speechSynthesis) return; if(!selectedVoice) selectedVoice=await pickEnglishVoice(); speaking=true; listening=false; const u=new SpeechSynthesisUtterance(t||''); u.lang='en-US'; u.voice=selectedVoice||null; u.rate=1; u.pitch=1; speechSynthesis.cancel(); speechSynthesis.speak(u); u.onend=()=>{ speaking=false; startListenFallback(); }; }
function startListenFallback(){
  if(!sttAvailable()){ $callStatus.textContent='Microphone not supported.'; return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{ sr && sr.abort(); }catch{}
  sr=new SR(); sr.lang='en-US'; sr.interimResults=true; sr.continuous=true;
  listening=true; $callStatus.textContent="Tell me, how can I help you today?";
  let final='';
  sr.onresult=(e)=>{ for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){ final=r[0].transcript.trim(); if(final){ try{ sr.abort(); }catch{} listening=false; $callStatus.textContent='…'; askAPI(final).then(j=>speakFallback(j.nl||'Here is the answer.')); }}} };
  sr.onerror=()=>{ listening=false; setTimeout(startListenFallback,250); };
  sr.onend=()=>{ if(!speaking) setTimeout(startListenFallback,120); };
  try{ sr.start(); }catch{ setTimeout(startListenFallback,200); }
}

/* ================== Mode switching ================== */
function enterTextMode(){
  $stream.style.display='block'; $vnStream.style.display='none';
  $textFooter.style.display='block'; $vnFooter.style.display='none';
  leaveCallMode();
}
function enterVoiceNoteMode(){
  $stream.style.display='none'; $vnStream.style.display='block';
  $textFooter.style.display='none'; $vnFooter.style.display='block';
  leaveCallMode();
}
async function enterCallMode(){
  $stream.style.display='none'; $vnStream.style.display='none';
  $textFooter.style.display='none'; $vnFooter.style.display='none';
  $callArea.style.display='flex';

  // Try PRO (OpenAI Realtime). If it fails, fallback.
  try{
    await startRealtimeCall();
  }catch{
    // Fallback to browser SR/TTS
    startVizFallback();
    speakFallback('Listening.');
  }
}
function leaveCallMode(){
  // Realtime cleanup
  try{ pc && pc.close(); }catch{} pc=null;
  try{ micStream && micStream.getTracks().forEach(t=>t.stop()); }catch{} micStream=null;
  // Fallback cleanup
  try{ sr && sr.abort(); }catch{} try{ speechSynthesis.cancel(); }catch{}
  listening=false; speaking=false;
  $viz.style.transform='scale(1)'; $viz.style.borderColor='#bfe7ff'; $viz.style.boxShadow='0 12px 40px rgba(14,165,233,.18)';
  $callStatus.textContent="Tell me, how can I help you today?";
  $callArea.style.display='none';
}

$modeToggle.addEventListener('click', (e)=>{
  const btn=e.target.closest('button'); if(!btn) return;
  [...$modeToggle.querySelectorAll('button')].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const m=btn.dataset.mode;
  if (m==='text') enterTextMode();
  else if (m==='voicenote') enterVoiceNoteMode();
  else if (m==='call') enterCallMode();
});

/* ================== KB modal ================== */
function openKB(){ $kbModal.style.display='flex'; }
function closeKB(){ $kbModal.style.display='none'; }
$gearBtn.addEventListener('click', openKB);
$kbCancel.addEventListener('click', closeKB);
$kbSave.addEventListener('click', ()=>{ try{ localStorage.setItem('demo_kb', $kbText.value);}catch{} closeKB(); });

/* ================== Welcome (text mode) ================== */
messages.push({ role:'assistant', html:`<div>Welcome! Choose <b>Text</b>, leave a <b>Voice Note</b> (audio bubble + text reply), or try <b>Call</b> for a breathtaking hands-free conversation. This demo uses simulated numbers tailored by your Company KB.</div>` });
renderText();
</script>
</body>
</html>
