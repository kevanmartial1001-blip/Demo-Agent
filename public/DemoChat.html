<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Universal Demo Agent — Chat</title>
<style>
  :root{
    --bg:#0b0c10;--panel:#0f121a;--card:#141824;--ink:#e9edf1;--muted:#9aa6b2;--line:#232735;--accent:#5eead4
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Inter,Arial}
  .app{display:grid;grid-template-columns:1fr 320px;gap:0;height:100%}
  .chat{display:flex;flex-direction:column;height:100%}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0}
  header .pill{border:1px solid var(--line);padding:4px 8px;border-radius:999px;color:var(--muted)}
  .stream{flex:1;overflow:auto;padding:18px 18px 8px}
  .msg{display:flex;margin:12px 0;gap:10px}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:780px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
  .msg.user .bubble{background:#1b2334}
  .role{font-size:12px;color:var(--muted);margin-bottom:6px}
  .cards{display:grid;gap:10px}
  .card{background:#151a26;border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h3{margin:0 0 6px 0;font-size:14px}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{border:1px solid var(--line);padding:7px;text-align:left;font-size:14px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted)}
  .composer{padding:12px;border-top:1px solid var(--line);background:var(--panel)}
  .row{display:flex;gap:10px}
  .grow{flex:1}
  input,button,textarea{font:inherit}
  input[type="text"]{background:#111520;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}
  button{background:var(--accent);color:#061015;border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  aside{border-left:1px solid var(--line);background:#0e1320;height:100%;display:flex;flex-direction:column}
  .asideHead{padding:14px 16px;border-bottom:1px solid var(--line)}
  .asideHead h2{margin:0;font-size:14px}
  .asideBody{padding:12px;overflow:auto}
  textarea.kb{width:100%;height:260px;background:#0b0f1a;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .save{margin-top:8px;width:100%;background:#1f2937;border:1px solid var(--line);color:var(--ink)}
  .lead{margin-top:14px;padding:10px;border:1px dashed var(--line);border-radius:10px}
  .dots{display:inline-block;min-width:24px}
  .dots:after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink);box-shadow:8px 0 0 var(--ink),16px 0 0 var(--ink);animation:pulse 1s infinite steps(1)}
  @keyframes pulse{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  @media (max-width:960px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- CHAT COLUMN -->
  <section class="chat">
    <header>
      <h1>Universal Demo Agent</h1>
      <span class="pill">Demo • KB-personalized</span>
      <span class="pill">No live connectors</span>
    </header>

    <div id="stream" class="stream"></div>

    <div class="composer">
      <div class="row">
        <input id="prompt" class="grow" type="text" placeholder="Ask anything… e.g., “What was our revenue last week?” or “Simulate a customer call about pricing.”" />
        <button id="send">Send</button>
      </div>
      <div class="muted" style="margin-top:6px;font-size:12px">Tip: Try “How much inventory for Ultra Hoodie?”, “Show upcoming vacations for the sales team”, or “Simulate a customer call about refunds”.</div>
    </div>
  </section>

  <!-- RIGHT SIDEBAR -->
  <aside>
    <div class="asideHead"><h2>Company KB</h2></div>
    <div class="asideBody">
      <textarea id="kb" class="kb">{
  "company_id": "acme-123",
  "company_name": "ACME Retail Group",
  "sector": "Retail",
  "primary_region": "Marbella",
  "example_top_product": "Ultra Hoodie",
  "example_top_region": "Andalucía",
  "example_employee_1": "C. Alvarez",
  "example_employee_2": "M. Duarte",
  "example_employee_3": "S. Ruiz"
}</textarea>
      <button class="save" id="saveKb">Save KB</button>

      <div class="lead">
        <div class="muted" style="font-size:13px;margin-bottom:6px">Want this connected to your real systems?</div>
        <button id="cta">Request Integration</button>
      </div>
    </div>
  </aside>
</div>

<script>
/* ---------- simple state ---------- */
let messages = []; // {role:'user'|'assistant', html:string}
const $stream = document.getElementById('stream');
const $prompt = document.getElementById('prompt');
const $send = document.getElementById('send');
const $kb = document.getElementById('kb');
const $saveKb = document.getElementById('saveKb');
const $cta = document.getElementById('cta');

try {
  const saved = localStorage.getItem('demo_kb');
  if (saved) $kb.value = saved;
} catch {}

/* ---------- rendering ---------- */
function scrollToBottom(){ $stream.scrollTop = $stream.scrollHeight; }

function render(){
  $stream.innerHTML = messages.map(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    return `
      <div class="msg ${role}">
        <div class="bubble">
          ${role === 'user' ? '<div class="role muted">You</div>' : '<div class="role muted">Demo Agent</div>'}
          ${m.html}
        </div>
      </div>`;
  }).join('');
  scrollToBottom();
}

function mdEscape(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function tableHTML(t){
  if (!t || !t.columns || !t.rows) return '';
  let h = '<table><thead><tr>';
  for (const c of t.columns) h += `<th>${mdEscape(String(c))}</th>`;
  h += '</tr></thead><tbody>';
  for (const r of t.rows) h += '<tr>' + r.map(v => `<td>${mdEscape(String(v))}</td>`).join('') + '</tr>';
  h += '</tbody></table>';
  return h;
}

function assistantHTMLFromResponse(json){
  const answer = (() => {
    if (json.answer?.format === 'table') {
      return `
        <div class="card">
          <h3>Answer</h3>
          <div class="muted">${mdEscape(json.answer.summary||'')}</div>
          ${tableHTML(json.answer.value)}
        </div>`;
    }
    return `<div class="card"><h3>Answer</h3><div>${mdEscape(json.answer?.value||'')}</div></div>`;
  })();

  const explain = `<div class="card"><h3>How it worked</h3><ol>${
    (json.explain?.steps||[]).map(s => `<li>${mdEscape(s)}</li>`).join('')
  }</ol></div>`;

  const impact = `<div class="card"><h3>Why it matters</h3><ul>${
    (json.impact?.bullets||[]).map(s => `<li>${mdEscape(s)}</li>`).join('')
  }</ul>${
    (json.impact?.ctas||[]).map(c => `<button onclick="openLead('${json.meta?.intent||''}','${json.meta?.trace_id||''}')">${mdEscape(c.label)}</button>`).join(' ')
  }</div>`;

  const meta = `<div class="meta">
    <span class="chip">Intent: ${mdEscape(json.meta?.intent||'')}</span>
    <span class="chip">Template: ${mdEscape(json.meta?.template_id||'')}</span>
    <span class="chip">Trace: ${mdEscape(json.meta?.trace_id||'')}</span>
  </div>`;

  return `<div class="cards">${answer}${explain}${impact}</div>${meta}`;
}

/* ---------- UX helpers ---------- */
function pushUser(text){
  messages.push({ role:'user', html: mdEscape(text) });
  render();
}
function pushAssistantThinking(){
  messages.push({ role:'assistant', html: `<span class="dots"></span>` });
  render();
  return messages.length - 1; // index to replace later
}
function replaceAssistant(index, html){
  messages[index] = { role:'assistant', html };
  render();
}

/* ---------- API call ---------- */
async function sendMessage(){
  const text = $prompt.value.trim();
  if (!text) return;

  // user bubble
  pushUser(text);
  $prompt.value = '';
  $prompt.focus();

  // assistant thinking bubble
  const idx = pushAssistantThinking();

  // build KB
  let kb = {};
  try { kb = JSON.parse($kb.value); } catch {}

  $send.disabled = true;
  try{
    const res = await fetch('/api/demoAgent', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ utterance: text, kb, demo: true })
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    replaceAssistant(idx, assistantHTMLFromResponse(json));
  } catch(e){
    replaceAssistant(idx, `<div class="card">Sorry, I couldn’t process that. (${mdEscape(String(e.message||e))})</div>`);
  } finally {
    $send.disabled = false;
  }
}

/* ---------- lead capture (very simple) ---------- */
function openLead(intent, trace){
  const name = prompt("Your name?");
  if (name === null) return;
  const email = prompt("Your email?");
  if (email === null) return;
  const company = prompt("Company?");
  if (company === null) return;
  const note = prompt("Anything specific to connect first?");
  fetch('/api/requestIntegration', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, email, company, note, intent, trace_id: trace })
  }).then(r=>r.json()).then(j=>{
    alert(j.ok ? "Thanks! We'll reach out to connect your systems." : "Sorry, something failed.");
  }).catch(()=>alert("Network error."));
}
window.openLead = openLead;

/* ---------- wire events ---------- */
$send.addEventListener('click', sendMessage);
$prompt.addEventListener('keydown', (e)=>{ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }});
$saveKb.addEventListener('click', () => {
  try { localStorage.setItem('demo_kb', $kb.value); } catch {}
  const idx = pushAssistantThinking();
  replaceAssistant(idx, `<div class="card"><h3>KB Updated</h3><div class="muted">New company context saved locally for this browser.</div></div>`);
});
$cta.addEventListener('click', () => openLead('connect_systems', ''));

/* ---------- welcome message ---------- */
messages.push({
  role:'assistant',
  html:`<div class="card"><h3>Welcome</h3>
  <div>Ask me anything about your business. I’ll answer with a realistic response, show you exactly <em>how</em> I did it, and explain why it matters — just like a digital employee. This is a demo using your Company KB (right panel), without live system connections.</div></div>`
});
render();
</script>
</body>
</html>
