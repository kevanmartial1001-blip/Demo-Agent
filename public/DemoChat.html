<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Universal Demo Agent</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#0b0c10; --muted:#647085; --line:#e6e8f0; --accent:#0ea5e9;
    --bubble-user:#e8f3ff; --bubble-ai:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,Segoe UI,Inter,Arial}
  .app{display:flex;flex-direction:column;height:100%}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10}
  header h1{font-size:15px;font-weight:600;margin:0}
  main{flex:1;overflow:auto}
  .stream{max-width:820px;margin:0 auto;padding:16px}
  .msg{display:flex;margin:14px 0}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:720px;border:1px solid var(--line);background:var(--bubble-ai);padding:12px 14px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .msg.user .bubble{background:var(--bubble-user)}
  .role{font-size:12px;color:var(--muted);margin-bottom:6px}
  .cards{display:grid;gap:10px;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h3{margin:0 0 6px 0;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{border:1px solid var(--line);padding:8px;text-align:left}
  .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted);background:#fff}
  footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
  .composer{max-width:820px;margin:0 auto}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  input,button,textarea{font:inherit}
  .box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  input[type="text"]{flex:1;border:none;outline:none;background:transparent;padding:8px 6px}
  button{border:none;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
  button.ghost{background:#eef2f7;color:#0b0c10}
  button:disabled{opacity:.6;cursor:not-allowed}
  .dots{display:inline-block;min-width:28px}
  .dots:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#111;box-shadow:8px 0 0 #111,16px 0 0 #111;animation:pulse 1s infinite steps(1)}
  @keyframes pulse{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  /* KB modal (gear) */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
  .sheet{width:min(720px,92%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .sheet h2{margin:0 0 8px 0;font-size:16px}
  .field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .field textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace}
  .sheet .row{justify-content:flex-end}
  /* small icons */
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Universal Demo Agent</h1>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button id="gear" class="icon-btn" title="Company KB">⚙️</button>
    </div>
  </header>

  <main>
    <div id="stream" class="stream"></div>
  </main>

  <footer>
    <div class="composer">
      <div class="row box">
        <button id="mic" class="icon-btn" title="Hold to speak">🎤</button>
        <input id="prompt" type="text" placeholder="Ask anything for your business…" />
        <button id="send">Send</button>
      </div>
      <div style="font-size:12px;color:#6b7280;margin-top:6px">Tip: “How much inventory for Ultra Hoodie?”, “What was our revenue last week?”, “Simulate a customer call about pricing.”</div>
    </div>
  </footer>
</div>

<!-- KB Modal -->
<div id="kbModal" class="modal">
  <div class="sheet">
    <h2>Company KB</h2>
    <div class="field">
      <label style="font-size:13px;color:#647085">JSON</label>
      <textarea id="kbText">{
  "company_id": "acme-123",
  "company_name": "ACME Retail Group",
  "sector": "Retail",
  "primary_region": "Marbella",
  "example_top_product": "Ultra Hoodie",
  "example_top_region": "Andalucía",
  "example_employee_1": "C. Alvarez",
  "example_employee_2": "M. Duarte",
  "example_employee_3": "S. Ruiz"
}</textarea>
    </div>
    <div class="row">
      <button id="kbCancel" class="ghost">Cancel</button>
      <button id="kbSave">Save</button>
    </div>
  </div>
</div>

<script>
/* ===== State ===== */
let messages = []; // {role:'user'|'assistant', html, raw?}
let rec, recActive=false, recTimer=null; // mic
const $stream = document.getElementById('stream');
const $prompt = document.getElementById('prompt');
const $send = document.getElementById('send');
const $mic = document.getElementById('mic');
const $kbModal = document.getElementById('kbModal');
const $kbText = document.getElementById('kbText');
const $kbSave = document.getElementById('kbSave');
const $kbCancel = document.getElementById('kbCancel');
const $gear = document.getElementById('gear');

try { const saved = localStorage.getItem('demo_kb'); if (saved) $kbText.value = saved; } catch {}

/* ===== Render ===== */
function scrollToBottom(){ $stream.scrollTop = $stream.scrollHeight; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function tableHTML(t){
  if (!t || !t.columns || !t.rows) return '';
  let h = '<table><thead><tr>';
  for (const c of t.columns) h += `<th>${esc(String(c))}</th>`;
  h += '</tr></thead><tbody>';
  for (const r of t.rows) h += '<tr>' + r.map(v => `<td>${esc(String(v))}</td>`).join('') + '</tr>';
  h += '</tbody></table>'; return h;
}
function assistantHTML(json){
  const nl = json.nl ? `<div>${esc(json.nl)}</div>` : '';
  const answer = (() => {
    if (json.answer?.format === 'table') {
      return `<div class="card"><h3>Answer</h3><div style="color:#6b7280">${esc(json.answer.summary||'')}</div>${tableHTML(json.answer.value)}</div>`;
    }
    return `<div class="card"><h3>Answer</h3><div>${esc(json.answer?.value||'')}</div></div>`;
  })();
  const explain = `<div class="card"><h3>How it worked</h3><ol>${(json.explain?.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
  const impact = `<div class="card"><h3>Why it matters</h3><ul>${(json.impact?.bullets||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${
    (json.impact?.ctas||[]).map(c=>`<button class="ghost" onclick="openLead()">${esc(c.label)}</button>`).join(' ')
  }</div>`;
  const meta = `<div class="meta"><span class="chip">Intent: ${esc(json.meta?.intent||'')}</span><span class="chip">Template: ${esc(json.meta?.template_id||'')}</span><span class="chip">Trace: ${esc(json.meta?.trace_id||'')}</span></div>`;
  return `${nl}<div class="cards">${answer}${explain}${impact}</div>${meta}`;
}
function render(){
  $stream.innerHTML = messages.map(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    return `<div class="msg ${role}"><div class="bubble">${role==='user'?'<div class="role">You</div>':'<div class="role">Demo Agent</div>'}${m.html}</div></div>`;
  }).join('');
  scrollToBottom();
}
function pushUser(text){ messages.push({ role:'user', html: esc(text) }); render(); }
function pushAssistantThinking(){ messages.push({ role:'assistant', html: `<span class="dots"></span>` }); render(); return messages.length-1; }
function replaceAssistant(i, html){ messages[i] = { role:'assistant', html }; render(); }

/* ===== Memory → backend ===== */
function buildHistory(){
  const hist = [];
  for (const m of messages){
    if (m.role==='user') hist.push({ role:'user', text: m.html.replace(/<[^>]+>/g,'') });
    if (m.role==='assistant' && m.raw?.meta){
      hist.push({ role:'assistant', intent: m.raw.meta.intent, entities: m.raw.entities||{} });
    }
  }
  return hist.slice(-12);
}

/* ===== API ===== */
async function sendMessage(text){
  pushUser(text);
  $prompt.value='';
  const idx = pushAssistantThinking();

  let kb={};
  try{ kb = JSON.parse($kbText.value); }catch{}

  $send.disabled = true;
  try{
    const res = await fetch('/api/demoAgent', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ utterance: text, kb, demo: true, history: buildHistory() })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    messages[idx] = { role:'assistant', html: assistantHTML(j), raw:{ meta:j.meta } };
    render();
  }catch(e){
    replaceAssistant(idx, `<div class="card">Error: ${esc(String(e.message||e))}</div>`);
  }finally{
    $send.disabled = false;
  }
}

/* ===== Composer wiring ===== */
function onSend(){
  const t = $prompt.value.trim();
  if (t) sendMessage(t);
}
$send.addEventListener('click', onSend);
$prompt.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
});

/* ===== Mic (press & hold) ===== */
function startRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition is not supported in this browser.'); return; }
  rec = new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult = e => { const t = e.results[0][0].transcript; $prompt.value = t; onSend(); };
  rec.onerror = () => stopRec();
  rec.onend = () => stopRec();
  recActive = true; $mic.textContent='⏺';
  rec.start();
}
function stopRec(){ try{ rec && rec.stop(); }catch{} recActive=false; $mic.textContent='🎤'; if(recTimer){clearTimeout(recTimer);recTimer=null;} }
$mic.addEventListener('mousedown', () => { if(!recActive) startRec(); });
$mic.addEventListener('touchstart', (e) => { e.preventDefault(); if(!recActive) startRec(); }, {passive:false});
['mouseup','mouseleave','touchend','touchcancel'].forEach(evt => $mic.addEventListener(evt, stopRec));

/* ===== KB modal ===== */
function openKB(){ $kbModal.style.display='flex'; }
function closeKB(){ $kbModal.style.display='none'; }
$gear.addEventListener('click', openKB);
$kbCancel.addEventListener('click', closeKB);
$kbSave.addEventListener('click', () => { try{ localStorage.setItem('demo_kb', $kbText.value); }catch{} closeKB(); });

/* ===== Lead (very simple) ===== */
function openLead(){ alert("We'll connect this to a lead form / CRM next."); }
window.openLead = openLead;

/* ===== Welcome ===== */
messages.push({ role:'assistant', html: `<div>Hi! I’m your digital employee. Ask me anything about your business — I’ll answer naturally, show <em>how</em> I’d do it, and why it matters. This is a demo (simulated numbers) tailored by your Company KB.</div>` });
render();
</script>
</body>
</html>
