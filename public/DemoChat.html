<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your AI Employee</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#0b0c10; --muted:#647085; --line:#e6e8f0; --accent:#0ea5e9;
    --bubble-user:#e8f3ff; --bubble-ai:#ffffff;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,Inter,Segoe UI,Arial}
  .app{display:flex;flex-direction:column;height:100%}

  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:10}
  header h1{font-size:15px;font-weight:600;margin:0}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .toggle button{border:none;background:#fff;padding:8px 12px;cursor:pointer;font-weight:600;color:#334155}
  .toggle button.active{background:var(--ink);color:#fff}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
  .spacer{flex:1}

  main{flex:1;overflow:auto}
  .stream{max-width:820px;margin:0 auto;padding:16px}
  .msg{display:flex;margin:14px 0}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:720px;border:1px solid var(--line);background:var(--bubble-ai);padding:12px 14px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .msg.user .bubble{background:var(--bubble-user)}
  .role{font-size:12px;color:var(--muted);margin-bottom:6px}

  .cards{display:grid;gap:10px;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h3{margin:0 0 6px 0;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{border:1px solid var(--line);padding:8px;text-align:left}
  .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:#647085;background:#fff}

  footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
  .composer{max-width:820px;margin:0 auto}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  input,button,textarea{font:inherit}

  .box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  input[type="text"]{flex:1;border:none;outline:none;background:transparent;padding:8px 6px}
  button{border:none;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
  button.ghost{background:#eef2f7;color:#0b0c10}
  button:disabled{opacity:.6;cursor:not-allowed}

  /* Voice call area */
  .callWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
  .viz{width:84px;height:84px;border-radius:999px;background:#eaf6ff;border:2px solid #bfe7ff;
    box-shadow:0 8px 30px rgba(14,165,233,.15);transform:scale(1);transition:transform .08s linear}
  .status{margin-top:8px;color:#647085;font-weight:600}
  .sub{font-size:12px;color:#9aa6b2;margin-top:2px}

  /* KB modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
  .sheet{width:min(720px,92%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .sheet h2{margin:0 0 8px 0;font-size:16px}
  .field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .field textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace}
  .sheet .row{justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Your AI Employee</h1>
    <div class="toggle" id="modeToggle">
      <button data-mode="text" class="active">Text</button>
      <button data-mode="voice">Voice</button>
    </div>
    <div class="spacer"></div>
    <button id="gearBtn" class="icon-btn" title="Company KB">⚙️</button>
  </header>

  <main>
    <div id="stream" class="stream"></div>
    <div id="callArea" class="callWrap" style="display:none">
      <div id="viz" class="viz"></div>
      <div id="callStatus" class="status">Idle</div>
      <div class="sub">Hands-free: say your request, I’ll reply, then listen again.</div>
    </div>
  </main>

  <footer>
    <!-- TEXT COMPOSER -->
    <div class="composer" id="composerText">
      <div class="row box">
        <input id="prompt" type="text" placeholder="Ask anything for your business…" />
        <button id="send">Send</button>
      </div>
    </div>

    <!-- VOICE COMPOSER -->
    <div class="composer" id="composerVoice" style="display:none">
      <div class="row box" style="justify-content:center">
        <button id="startCall" class="ghost">Start Voice</button>
        <button id="stopCall" class="ghost" disabled>Stop</button>
        <span id="langNote" class="sub" style="margin-left:8px">English</span>
      </div>
    </div>
  </footer>
</div>

<!-- KB Modal -->
<div id="kbModal" class="modal">
  <div class="sheet">
    <h2>Company KB</h2>
    <div class="field">
      <label style="font-size:13px;color:#647085">JSON</label>
      <textarea id="kbText">{
  "company_id": "acme-123",
  "company_name": "ACME Retail Group",
  "sector": "Retail",
  "primary_region": "Marbella",
  "example_top_product": "Ultra Hoodie",
  "example_top_region": "Andalucía",
  "example_employee_1": "C. Alvarez",
  "example_employee_2": "M. Duarte",
  "example_employee_3": "S. Ruiz"
}</textarea>
    </div>
    <div class="row">
      <button id="kbCancel" class="ghost">Cancel</button>
      <button id="kbSave">Save</button>
    </div>
  </div>
</div>

<script>
/* ====== State ====== */
let messages = []; // chat history (for Text mode UI + memory)
const $stream = document.getElementById('stream');
const $composerText = document.getElementById('composerText');
const $composerVoice = document.getElementById('composerVoice');
const $modeToggle = document.getElementById('modeToggle');
const $prompt = document.getElementById('prompt');
const $send = document.getElementById('send');
const $startCall = document.getElementById('startCall');
const $stopCall = document.getElementById('stopCall');
const $callArea = document.getElementById('callArea');
const $callStatus = document.getElementById('callStatus');
const $viz = document.getElementById('viz');
const $gearBtn = document.getElementById('gearBtn');
const $kbModal = document.getElementById('kbModal');
const $kbText = document.getElementById('kbText');
const $kbSave = document.getElementById('kbSave');
const $kbCancel = document.getElementById('kbCancel');

try { const saved = localStorage.getItem('demo_kb'); if (saved) $kbText.value = saved; } catch {}

/* ====== Chat rendering (Text mode only) ====== */
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function tableHTML(t){ if(!t||!t.columns||!t.rows) return ''; let h='<table><thead><tr>'; for(const c of t.columns) h+=`<th>${esc(String(c))}</th>`; h+='</tr></thead><tbody>'; for(const r of t.rows) h+='<tr>'+r.map(v=>`<td>${esc(String(v))}</td>`).join('')+'</tr>'; h+='</tbody></table>'; return h; }
function assistantHTML(j){
  const nl = j.nl ? `<div>${esc(j.nl)}</div>` : '';
  const answer = j.answer?.format==='table'
    ? `<div class="card"><h3>Answer</h3><div style="color:#6b7280">${esc(j.answer.summary||'')}</div>${tableHTML(j.answer.value)}</div>`
    : `<div class="card"><h3>Answer</h3><div>${esc(j.answer?.value||'')}</div></div>`;
  const explain = `<div class="card"><h3>How it worked</h3><ol>${(j.explain?.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`;
  const impact = `<div class="card"><h3>Why it matters</h3><ul>${(j.impact?.bullets||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  const meta = `<div class="meta"><span class="chip">Intent: ${esc(j.meta?.intent||'')}</span><span class="chip">Template: ${esc(j.meta?.template_id||'')}</span><span class="chip">Trace: ${esc(j.meta?.trace_id||'')}</span></div>`;
  return `${nl}<div class="cards">${answer}${explain}${impact}</div>${meta}`;
}
function render(){
  $stream.innerHTML = messages.map(m=>{
    const role = m.role==='user'?'user':'assistant';
    return `<div class="msg ${role}"><div class="bubble">${role==='user'?'<div class="role">You</div>':'<div class="role">Your AI Employee</div>'}${m.html}</div></div>`;
  }).join('');
  $stream.scrollTop = $stream.scrollHeight;
}
function pushUser(text){ messages.push({role:'user', html:esc(text)}); render(); }
function pushAssistant(j){ messages.push({role:'assistant', html:assistantHTML(j), raw:{meta:j.meta}}); render(); }

/* ====== API helpers ====== */
function historyForAPI(){
  const h=[]; for(const m of messages){ if(m.role==='user') h.push({role:'user',text:m.html.replace(/<[^>]+>/g,'')}); if(m.role==='assistant' && m.raw?.meta){ h.push({role:'assistant',intent:m.raw.meta.intent,entities:m.raw.entities||{}}); } }
  return h.slice(-12);
}
async function askAPI(text){
  let kb={}; try{ kb=JSON.parse($kbText.value);}catch{}
  const r = await fetch('/api/demoAgent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({utterance:text,kb, demo:true, history:historyForAPI()})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ====== TEXT MODE ====== */
function sendText(){
  const t = $prompt.value.trim(); if(!t) return;
  pushUser(t); $prompt.value='';
  askAPI(t).then(pushAssistant).catch(e=>pushAssistant({ nl:`Error: ${esc(String(e.message||e))}`, answer:{format:'text',value:''}, explain:{steps:[]}, impact:{bullets:[]}, meta:{} }));
}
$send.addEventListener('click', sendText);
$prompt.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }});

/* ====== VOICE MODE ======
   - English only (en-US)
   - Always-on loop: listen → send → speak → listen …
   - No transcripts/bubbles; only the animated circle + status
============================================================= */
let audioCtx=null, analyser=null, micSource=null, rafId=null;
let sr=null, listening=false, speaking=false;

function haveSTT(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

async function initMicVisualizer(){
  if (audioCtx) return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  micSource = audioCtx.createMediaStreamSource(stream);
  micSource.connect(analyser);
}

function startViz(){ // animate circle based on mic RMS when listening; gentle pulse when speaking
  const data = new Uint8Array(analyser.frequencyBinCount);
  function tick(){
    if (!analyser){ rafId = requestAnimationFrame(tick); return; }
    if (listening){
      analyser.getByteTimeDomainData(data);
      // RMS of waveform around 128
      let sum=0;
      for (let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
      const rms = Math.sqrt(sum/data.length); // 0..~1
      const scale = 1 + Math.min(0.9, rms*3); // scale up with voice
      $viz.style.transform = `scale(${scale.toFixed(2)})`;
    } else if (speaking){
      // soft breathing animation
      const t = Date.now()/500;
      const scale = 1 + 0.08*Math.sin(t*2*Math.PI);
      $viz.style.transform = `scale(${scale.toFixed(2)})`;
    } else {
      $viz.style.transform = 'scale(1)';
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function speakOut(text){
  if (!window.speechSynthesis) return;
  speaking=true; listening=false; $callStatus.textContent='Speaking…';
  const u = new SpeechSynthesisUtterance(text||'');
  u.lang = 'en-US'; u.rate = 1; u.pitch = 1;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  u.onend = ()=>{ speaking=false; startListen(); };
}

function startListen(){
  if (!haveSTT()){ alert('Speech recognition not supported in this browser.'); stopCall(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  sr = new SR(); sr.lang='en-US'; sr.interimResults=false; sr.maxAlternatives=1; sr.continuous=false;
  listening = true; $callStatus.textContent='Listening…';
  sr.onresult = e => {
    const text = e.results[0][0].transcript;
    // Do NOT render transcript (voice mode is transcript-less)
    $callStatus.textContent='Thinking…';
    askAPI(text).then(j=>{
      // Voice mode: speak response; also show cards minimally (optional)
      // We’ll still append cards for credibility:
      messages.push({ role:'assistant', html:assistantHTML(j), raw:{meta:j.meta} });
      render();
      speakOut(j.nl || 'Here is the answer.');
    }).catch(err=>{
      speaking=false; listening=false;
      $callStatus.textContent='Error';
    });
  };
  sr.onerror = () => { if (!speaking) setTimeout(startListen, 300); };
  sr.onend = () => { if (!speaking) setTimeout(startListen, 150); }; // auto-restart (always-on)
  sr.start();
}

async function startCall(){
  $startCall.disabled=true; $stopCall.disabled=false;
  $callArea.style.display='flex'; $composerVoice.querySelector('.row').style.pointerEvents='none';
  try{
    await initMicVisualizer(); startViz();
    startListen(); // kicks off the loop
  } catch {
    $callStatus.textContent='Mic access denied';
  }
}
function stopCall(){
  try{ sr && sr.abort(); }catch{}
  try{ speechSynthesis.cancel(); }catch{}
  listening=false; speaking=false;
  $callStatus.textContent='Idle';
  $startCall.disabled=false; $stopCall.disabled=true;
  if (rafId) cancelAnimationFrame(rafId);
  $viz.style.transform='scale(1)';
  $composerVoice.querySelector('.row').style.pointerEvents='auto';
}

$startCall.addEventListener('click', startCall);
$stopCall.addEventListener('click', stopCall);

/* ====== Mode toggle ====== */
$modeToggle.addEventListener('click', (e)=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$modeToggle.querySelectorAll('button')].forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const m=b.dataset.mode;
  if (m==='text'){
    $composerText.style.display='block';
    $composerVoice.style.display='none';
    $callArea.style.display='none';
    stopCall();
  } else {
    $composerText.style.display='none';
    $composerVoice.style.display='block';
    $callArea.style.display='flex';
  }
});

/* ====== KB Modal ====== */
function openKB(){ $kbModal.style.display='flex'; }
function closeKB(){ $kbModal.style.display='none'; }
$gearBtn.addEventListener('click', openKB);
$kbCancel.addEventListener('click', closeKB);
$kbSave.addEventListener('click', ()=>{ try{ localStorage.setItem('demo_kb', $kbText.value);}catch{} closeKB(); });

/* ====== Welcome bubble (Text mode) ====== */
messages.push({ role:'assistant', html:`<div>Hi! I’m your AI Employee. Use <b>Text</b> or switch to <b>Voice</b> for a hands-free conversation. I’ll answer naturally, show how I would do it, and why it matters. This is a demo with simulated numbers, tailored by your Company KB.</div>` });
render();
</script>
</body>
</html>
